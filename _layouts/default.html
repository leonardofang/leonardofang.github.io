<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/profile.css' | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <header class="site-header">
      <div class="nav-shell">
        <a class="site-name" href="{{ '/' | relative_url }}"><strong>Le</strong> Fang</a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation">☰</button>
        <nav class="site-nav" id="site-nav" aria-label="Main navigation">
          <a href="#about">About</a>
          <a href="#news">News</a>
          <a href="#research">Research</a>
          <a href="#publications">Publications</a>
          <a href="#education">Education</a>
          <button class="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">◐</button>
        </nav>
      </div>
    </header>

    <main class="page-shell">{{ content }}</main>

    <footer class="site-footer">
      <p>© {{ 'now' | date: '%Y' }} Le Fang. Built with Jekyll and hosted by GitHub Pages.</p>
    </footer>

    <script>
      const root = document.documentElement;
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) root.dataset.theme = savedTheme;
      document.querySelector('.theme-toggle').addEventListener('click', () => {
        const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        localStorage.setItem('theme', next);
      });
      const menuButton = document.querySelector('.menu-toggle');
      const nav = document.querySelector('.site-nav');
      menuButton.addEventListener('click', () => {
        const open = nav.classList.toggle('is-open');
        menuButton.setAttribute('aria-expanded', open);
      });
      nav.querySelectorAll('a').forEach((link) => link.addEventListener('click', () => {
        nav.classList.remove('is-open');
        menuButton.setAttribute('aria-expanded', 'false');
      }));
    </script>
  </body>
</html>
